<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1491" height="539" viewBox="0 0 1491 539">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E91E8C"/>
    </marker>
    <style><![CDATA[
      .lane-label { font: 22px sans-serif; fill: #000; text-anchor: middle; }
      .margin-label { font: 18px sans-serif; fill: #000; text-anchor: start; }
      .margin-label-pink { font: 18px sans-serif; fill: #E91E8C; text-anchor: start; }
      .road-boundary { stroke: #000; stroke-width: 5; fill: none; }
      .lane-divider { stroke: #000; stroke-width: 4; fill: none; stroke-dasharray: 18 12; }
      .lane-dotted { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 4 6; }
      .trajectory { fill: none; stroke: #00CFCF; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .dim-black { stroke: #000; stroke-width: 2; fill: none; marker-start: url(#arrowBlack); marker-end: url(#arrowBlack); }
      .dim-pink { stroke: #E91E8C; stroke-width: 2.5; fill: none; marker-start: url(#arrowPink); marker-end: url(#arrowPink); }
      .car-body { fill: #fff; stroke: #000; stroke-width: 2.5; }
      .car-window { fill: none; stroke: #000; stroke-width: 1.5; }
      .obstacle-box { fill: rgba(255, 140, 0, 0.35); stroke: #FF8C00; stroke-width: 2; }
    ]]></style>
  </defs>

  <rect width="1491" height="539" fill="#fff"/>

  <line x1="40" y1="28" x2="1451" y2="28" class="road-boundary"/>
  <line x1="40" y1="511" x2="1451" y2="511" class="road-boundary"/>

  <line x1="40" y1="168" x2="1451" y2="168" class="lane-divider"/>

  <line x1="40" y1="268" x2="1451" y2="268" class="lane-dotted"/>
  <line x1="40" y1="368" x2="1451" y2="368" class="lane-dotted"/>

  <text x="745" y="110" class="lane-label">对向车道</text>

  <path d="M 310 248 C 430 190, 560 190, 700 248 S 920 330, 1040 318" class="trajectory"/>

  <g transform="translate(310,248) rotate(-8)">
    <rect x="-42" y="-18" width="84" height="36" rx="6" class="car-body"/>
    <rect x="-14" y="-12" width="28" height="24" rx="2" class="car-window"/>
  </g>

  <g transform="translate(1040,318) rotate(6)">
    <rect x="-42" y="-18" width="84" height="36" rx="6" class="car-body"/>
    <rect x="-14" y="-12" width="28" height="24" rx="2" class="car-window"/>
  </g>

  <g transform="translate(620,430) rotate(18)">
    <rect x="-50" y="-20" width="100" height="40" rx="6" class="car-body"/>
    <rect x="-16" y="-14" width="32" height="28" rx="2" class="car-window"/>
  </g>
  <rect x="545" y="395" width="150" height="75" rx="4" class="obstacle-box"/>

  <line x1="1200" y1="172" x2="1200" y2="264" class="dim-black"/>
  <text x="1215" y="225" class="margin-label">侧向软裕度</text>

  <line x1="1200" y1="272" x2="1200" y2="364" class="dim-black"/>
  <text x="1215" y="325" class="margin-label">侧向硬裕度</text>

  <line x1="355" y1="278" x2="585" y2="405" class="dim-pink"/>
  <text x="460" y="310" class="margin-label-pink">实际缩短裕度</text>
</svg>
